<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Activities Management</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            margin: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px 15px;
            text-align: left;
        }

        th {
            background-color: #649765;
            color: white;
        }

        td {
            background-color: #fff;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .action-button {
            background-color: #008CBA;
            color: white;
            border: none;
            padding: 8px 12px;
            text-align: center;
            cursor: pointer;
            border-radius: 5px;
            margin-right: 5px;
            transition: background-color 0.3s;
        }

        .action-button:hover {
            background-color: #005f7f;
        }

        .form-container {
            margin-bottom: 20px;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
        }

        .form-group input {
            width: 90%;
            padding: 12px 15px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }

        .form-group input:focus {
            border-color: #649765;
            background-color: #fff;
        }

        .submit-button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .submit-button:hover {
            background-color: #45a049;
        }

        a {
            text-decoration: none;
            color: #007BFF;
            font-weight: bold;
            margin-right: 20px;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>Activities Management</h1>

<div class="form-container">
    <div class="form-group">
        <label for="newActivityName">New Activity Name:</label>
        <input type="text" id="newActivityName" placeholder="Enter activity name">
    </div>
    <div class="form-group">
        <label for="newActivityUserId">User ID:</label>
        <input type="number" id="newActivityUserId" placeholder="Enter user ID">
    </div>
    <button class="submit-button" onclick="addActivity()">Add Activity</button>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>User ID</th>
        <th>Name</th>
        <th>Time</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="activity : ${activitiesList}">
        <td th:text="${activity.activityId}"></td>
        <td th:text="${activity.userId}"></td>
        <td th:text="${activity.name}"></td>
        <td th:with="totalMinutes=${statisticsVOS[activity.activityId]} ?: 0,
            hours=${totalMinutes / 60},
            minutes=${totalMinutes % 60}"
            th:text="${hours > 0 ? (minutes > 0 ? hours + ' h ' + minutes + ' m' : hours + ' h') : minutes + ' m'}">
        </td>
        <td>
            <button class="action-button" th:attr="onclick='editActivity(' + ${activity.activityId} + ', ' + ${activity.userId} + ', ' + ${activity.name} + ')'" >Edit</button>
            <button class="action-button" th:attr="onclick='deleteActivity(' + ${activity.activityId} + ')'" >Delete</button>
        </td>
    </tr>
    </tbody>
</table>

<script>
    function addActivity() {
        const name = document.getElementById('newActivityName').value;
        const userId = document.getElementById('newActivityUserId').value;

        if (!name || !userId) {
            alert('Please fill in all fields');
            return;
        }

        $.ajax({
            url: '/activity/save',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({userId: parseInt(userId), name: name}),
            success: function(response) {
                alert('Activity added: ' + response.data.name);
                location.reload(); // Refresh the page to update the list
            },
            error: function(error) {
                alert('Error adding activity: ' + error.responseText);
            }
        });
    }

    function editActivity(activityId, userId, name) {
        const newName = prompt('Enter new activity name:', name);
        if (newName === null) {
            return; // User canceled the prompt
        }

        $.ajax({
            url: '/activities/update',
            type: 'PUT',
            contentType: 'application/json',
            data: JSON.stringify({activityId: activityId, userId: userId, name: newName}),
            success: function(response) {
                alert('Activity updated: ' + response.data.name);
                location.reload(); // Refresh the page to update the list
            },
            error: function(error) {
                alert('Error updating activity: ' + error.responseText);
            }
        });
    }

    function deleteActivity(activityId) {
        if (!confirm('Are you sure you want to delete this activity?')) {
            return; // User canceled the confirmation
        }

        $.ajax({
            url: '/activities/delete/' + activityId,
            type: 'DELETE',
            success: function(response) {
                alert('Activity deleted: ' + response.data);
                location.reload(); // Refresh the page to update the list
            },
            error: function(error) {
                alert('Error deleting activity: ' + error.responseText);
            }
        });
    }
</script>

<a href="/web/index">Go to Time Page</a>
<a href="/web/test">Go to Test Page</a>

</body>
</html>
