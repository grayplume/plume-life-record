<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=0.8">
    <title>Test Page</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <style>
        /* 给canvas元素添加固定的大小 */
        canvas {
            width: 90%;  /* 设置图表的宽度 */
            height: auto; /* 设置图表的高度 */
            margin: 0 auto;
            position: relative;

        }

        body{
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            margin: 20px;
            /*width: 95%;   !* 确保宽度不超过屏幕 *!*/
            overflow-x: hidden;  /* 防止横向滚动条 */
        }


    </style>
</head>

<body>
<div th:replace="~{navbar :: navbar}"></div>
<h1>Welcome to the Test Page</h1>
<h2>Today's Time</h2>

<!-- 渲染 hourlyDuration 数据到 HTML 元素中 -->
<div id="hourlyData" th:data-hourly-duration="${hourlyDurationJson}"></div>
<div id="dailyDuration" th:data-daily-duration="${dailyDurationJson}"></div>

<canvas id="heatmapChart" width="400" height="200"></canvas>

<h2>Mouth's Time</h2>


<canvas id="studyDurationChart" width="400" height="200"></canvas>

<script>
    var ctx = document.getElementById('heatmapChart').getContext('2d');

    // 从 HTML 元素中获取 data-hourly-duration 属性数据，并解析为 JSON 对象
    var hourlyDuration = JSON.parse(document.getElementById('hourlyData').getAttribute('data-hourly-duration'));

    console.log(hourlyDuration);  // 调试输出，查看数据是否正确

    // 获取某个具体日期的数据（例如最新的日期）
    var selectedDate = Object.keys(hourlyDuration)[0]; // 假设后端只返回一个日期
    var hourlyDurationElement = hourlyDuration[selectedDate];

    console.log("Hourly Data for", selectedDate, hourlyDurationElement);

    // 创建一个包含 0-23 点的数组
    var hours = Array.from({ length: 24 }, (_, k) => k);

    // 填充每小时的活动时长数据（没有数据的默认 0）
    var data = hours.map(hour => hourlyDurationElement[hour]/60 || 0);

    console.log(data);

    var chart1 = new Chart(ctx, {
        type: 'bar',  // 使用柱状图
        data: {
            labels: hours,  // X 轴：每小时
            datasets: [{
                label: 'Activity Time (Minutes)',
                data: data,  // Y 轴：每个小时的活动时长
                backgroundColor: function(context) {
                    var value = context.dataset.data[context.dataIndex];
                    // 设置背景色：根据时长动态设置颜色
                    return value > 40 ? 'rgb(12,106,106)' :
                        value > 20 ? 'rgb(32,151,152)' :
                            'rgba(75, 192, 192, 0.7)';
                },
                borderColor: 'rgba(255, 255, 255, 1)',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    min: 0,     // 最小值固定为 0
                    max: 60     // 最大值固定为 60，根据你的数据情况调整
                }
            }
        }
    });


    var ctx2 = document.getElementById('studyDurationChart').getContext('2d');

    // 获取从 Thymeleaf 模板传递的 JSON 数据
    var dailyDurationRaw = document.getElementById('dailyDuration').getAttribute('data-daily-duration');
    console.log("Raw dailyDuration data: ", dailyDurationRaw);  // 打印原始数据

    // 解析 JSON 数据
    var dailyDuration = JSON.parse(dailyDurationRaw);
    console.log("Parsed dailyDuration: ", dailyDuration);  // 打印解析后的数据

    // 提取日期和学习时长
    var dates = dailyDuration.map(function(record) {
        // 从每个对象中获取日期键
        return Object.keys(record)[0];  // 取出日期（key）
    });

    var durations = dailyDuration.map(function(record) {
        // 从每个对象中获取学习时长值
        return record[Object.keys(record)[0]]/60/60;  // 取出学习时长（value）
    });

    console.log("Dates: ", dates);  // 输出日期数组
    console.log("Durations: ", durations);  // 输出学习时长数组

    // // 按月汇总数据
    // var monthDurationMap = {};
    // dates.forEach(function(date, index) {
    //     // 提取月份（格式：YYYY-MM）
    //     var month = new Date(date).toISOString().slice(0, 7);
    //
    //     // 将学习时长（秒）转换为分钟
    //     var durationInMinutes = durations[index] / 60;
    //
    //     // 汇总每个月的学习时长
    //     if (monthDurationMap[month]) {
    //         monthDurationMap[month] += durationInMinutes;
    //     } else {
    //         monthDurationMap[month] = durationInMinutes;
    //     }
    // });
    // // 获取所有月份和对应的总学习时长
    // var months = Object.keys(monthDurationMap);
    // var monthlyDurations = Object.values(monthDurationMap);

    // 创建图表
    var chart2 = new Chart(ctx2, {
        type: 'bar',  // 使用柱状图
        data: {
            // labels: dates,  // X 轴：月份
            labels: dates.map(date => {
                // 假设 dates 是字符串数组如 ["2025-03-01", ...]
                return date.split('-')[2]; // 提取天数部分
                // 如果是 Date 对象：return new Date(date).getDate();
            }),
            datasets: [{
                label: 'Monthly Study Duration (Hour)',  // Y 轴：每个月的学习时长（分钟）
                data: durations,  // 每个月的学习时长
                backgroundColor: function(context) {
                    var value = context.dataset.data[context.dataIndex];
                    // 设置背景色：根据时长动态设置颜色
                    return value > 8 ? 'rgb(12,106,106)' :
                        value > 4 ? 'rgb(32,151,152)' :
                            'rgba(75, 192, 192, 0.7)';
                },
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                x: {
                    type: 'category',
                    title: {
                        display: true,
                        text: 'Day of Month'
                    }
                },
                // 可选：进一步控制标签显示
            //     ticks: {
            //         autoSkip: true,      // 自动跳过拥挤的标签
            //         maxRotation: 0,      // 禁止旋转标签
            //         callback: function(value) {
            //             return value;   // 直接显示天数（已预处理）
            //         }
            //     }
            // },
                y: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'Duration (Minutes)'
                    },
                    min: 0,     // 最小值固定为 0
                    max: 12     // 最大值固定根据你的数据情况调整
                }
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        title: function(context) {
                            return dates[context[0].dataIndex]; // 悬停时显示完整日期
                        }
                    }
                }
            }
        }
    });
</script>

</body>
</html>
