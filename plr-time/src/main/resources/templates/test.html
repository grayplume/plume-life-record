<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=0.8">
    <title>Test Page</title>
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <style>
        /* 给canvas元素添加固定的大小 */
        canvas {
            width: 90%;  /* 设置图表的宽度 */
            height: auto; /* 设置图表的高度 */
            margin: 0 auto;
            position: relative;

        }

        body{
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            margin: 20px;
            /*width: 95%;   !* 确保宽度不超过屏幕 *!*/
            overflow-x: hidden;  /* 防止横向滚动条 */
        }

         #pieChart {
             width: 100%;
             max-width: 600px;
             height: 400px;
             margin: 2rem auto;
         }

        /* 统计总时间 */
        .summary-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin: 2rem auto;
            max-width: 1000px;
            padding: 0 1rem;
        }

        .summary-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            padding: 1.2rem;
            flex: 1 1 calc(25% - 1rem); /* 每列占据25%减去间隙 */
            text-align: center;
            transition: transform 0.2s ease;
        }

        .summary-card:hover {
            transform: scale(1.05);
        }

        .summary-title {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 0.4rem;
        }

        .summary-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0e7c7b;
        }

        /* 小屏：每行最多 2 列 */
        @media (max-width: 768px) {
            .summary-card {
                flex: 1 1 calc(50% - 1rem); /* 每行占 50% */
            }
        }

        /* 超小屏：每行 1 个 */
        @media (max-width: 480px) {
            .summary-card {
                flex: 1 1 100%; /* 每个卡片占满整行 */
            }
        }


    </style>
</head>

<body>
<div th:replace="~{navbar :: navbar}"></div>
<h1>Welcome to the Test Page</h1>
<h2>Today's Time</h2>

<h2>统计概览</h2>
<div class="summary-container">
    <div class="summary-card">
        <div class="summary-title">总计时</div>
        <div class="summary-value" th:text="${totalDurationFormatted}">00h 00m</div>
    </div>
    <div class="summary-card">
        <div class="summary-title">今年</div>
        <div class="summary-value" th:text="${yearDurationFormatted}">00h 00m</div>
    </div>
    <div class="summary-card">
        <div class="summary-title">本月</div>
        <div class="summary-value" th:text="${monthDurationFormatted}">00h 00m</div>
    </div>
    <div class="summary-card">
        <div class="summary-title">本周</div>
        <div class="summary-value" th:text="${weekDurationFormatted}">00h 00m</div>
    </div>
    <div class="summary-card">
        <div class="summary-title">今日</div>
        <div class="summary-value" th:text="${todayDurationFormatted}">00h 00m</div>
    </div>
</div>


<!-- 渲染 hourlyDuration 数据到 HTML 元素中 -->
<div id="hourlyData" th:data-hourly-duration="${hourlyDurationJson}"></div>
<div id="dailyDuration" th:data-daily-duration="${dailyDurationJson}"></div>

<div id="pieChart" style="width: 100%; height: 400px;"></div>
<div id="chart1" style="width: 100%; height: 400px;"></div>
<h2>Mouth's Time</h2>
<div id="chart2" style="width: 100%; height: 300px;"></div>
<div id="activity-record-display-div"
     style="display: none; margin: 20px auto; padding: 0 16px; max-width: 600px; width: 100%; box-sizing: border-box;">
    <textarea id="activity-record-display"
              readonly
              onclick="this.select()"
              style="width: 100%; height: 250px; padding: 16px;
                     border: 1px solid #ccc; border-radius: 8px;
                     font-family: Arial, sans-serif; font-size: 1rem;
                     line-height: 1.5; background: #f9f9f9; color: #333;
                     resize: vertical; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
                     box-sizing: border-box;">
    </textarea>
</div>

    // 从 HTML 元素中获取 data-hourly-duration 属性数据，并解析为 JSON 对象
    const hourlyDuration = JSON.parse(document.getElementById('hourlyData').getAttribute('data-hourly-duration'));
    console.log(hourlyDuration);  // 调试输出，查看数据是否正确
    // 获取某个具体日期的数据（例如最新的日期）
    const selectedDate = Object.keys(hourlyDuration)[0]; // 假设后端只返回一个日期
    const hourlyDurationElement = hourlyDuration[selectedDate];

    console.log("Hourly Data for", selectedDate, hourlyDurationElement);

    // 创建一个包含 0-23 点的数组
    const hours = Array.from({length: 24}, (_, k) => k);

    // 填充每小时的活动时长数据（没有数据的默认 0）
    const data = hours.map(hour => hourlyDurationElement[hour] / 60 || 0);

    console.log(data);

    // const hours = [...Array(24).keys()].map(h => h + ":00");  // 示例：["0:00", "1:00", ...]
    // const data = [5, 10, 15, 22, 45, 50, 60, 40, 25, 18, 10, 8, 0, 5, 10, 20, 25, 30, 50, 60, 40, 30, 15, 10];

    const chart1 = echarts.init(document.getElementById('chart1'));

    const option1 = {
        tooltip: {
            trigger: 'axis',
            formatter: function (params) {
                const hour = params[0].axisValue;
                const value = params[0].data;
                return `${hour}：${value} 分钟`;
            }
        },
        xAxis: {
            type: 'category',
            data: hours,
            name: 'Hour of Day',
            axisLabel: {
                interval: 0, // 全部显示
                rotate: 45   // 旋转避免重叠（可选）
            }
        },
        yAxis: {
            type: 'value',
            name: 'Duration (Minutes)',
            min: 0,
            max: 60
        },
        series: [{
            type: 'bar',
            data: data,
            barWidth: '90%',
            itemStyle: {
                color: function (params) {
                    const value = params.value;
                    return value > 40 ? 'rgb(12,106,106)' :
                        value > 20 ? 'rgb(32,151,152)' :
                            'rgba(75, 192, 192, 0.7)';
                },
                borderColor: 'rgba(255, 255, 255, 1)',
                borderWidth: 1
            }
        }]
    };

    chart1.setOption(option1);




    // 获取从 Thymeleaf 模板传递的 JSON 数据
    const dailyDurationRaw = document.getElementById('dailyDuration').getAttribute('data-daily-duration');
    console.log("Raw dailyDuration data: ", dailyDurationRaw);  // 打印原始数据

    // 解析 JSON 数据
    const dailyDuration = JSON.parse(dailyDurationRaw);
    console.log("Parsed dailyDuration: ", dailyDuration);  // 打印解析后的数据

    // 提取日期和学习时长
    const dates = dailyDuration.map(function (record) {
        // 从每个对象中获取日期键
        return Object.keys(record)[0];  // 取出日期（key）
    });

    const durations = dailyDuration.map(function (record) {
        // 从每个对象中获取学习时长值
        return record[Object.keys(record)[0]] / 60 / 60;  // 取出学习时长（value）
    });

    console.log("Dates: ", dates);  // 输出日期数组
    console.log("Durations: ", durations);  // 输出学习时长数组


    // 创建图表
    const chart2 = echarts.init(document.getElementById('chart2'));

    // const dates = [
    //     "2025-03-01", "2025-03-02", "2025-03-03", "2025-03-04", "2025-03-05"
    // ];

    const option2 = {
        tooltip: {
            trigger: 'axis',
            formatter: function (params) {
                const index = params[0].dataIndex;
                const date = dates[index];
                const duration = params[0].value;
                return `${date}：${duration} 小时`;
            }
        },
        xAxis: {
            type: 'category',
            data: dates.map(d => d.split('-')[2]),  // 提取“日”
            name: 'Day of Month',
            nameLocation: 'middle',
            nameGap: 30
        },
        yAxis: {
            type: 'value',
            name: 'Duration (Hours)',
            min: 0,
            max: 12
        },
        series: [{
            type: 'bar',
            data: durations,
            itemStyle: {
                color: function (params) {
                    const value = params.value;
                    return value > 8 ? 'rgb(12,106,106)' :
                        value > 4 ? 'rgb(32,151,152)' :
                            'rgba(75, 192, 192, 0.7)';
                }
            },
            barWidth: '80%'
        }]
    };

    chart2.setOption(option2);


    // 从 Thymeleaf 获取后端传递的数据
    // const dayActivityDurationsRaw = document.getElementById('todayActivityDurations').getAttribute('data-today-duration');
    // console.log("Raw dayActivityDurations data: ", dayActivityDurationsRaw);

    var pieData = JSON.parse(/*[[${todayActivityDurationsJson}]]*/ '[]');

    console.log("Parsed dayActivityDurations: ", pieData);

    // 初始化 ECharts 实例
    var chart = echarts.init(document.getElementById('pieChart'));

    // 判断数据是否为空
    if (!pieData || pieData.length === 0) {
        chart.showLoading({
            text: '暂无数据',
            color: '#888',
            textColor: '#aaa',
            maskColor: 'rgba(255, 255, 255, 0.8)',
            zlevel: 0
        });
    } else {
        var option = {
            title: {
                text: '今日活动时间分布（点击可复制数据）',
                left: 'center',
                top: 10,
                textStyle: {
                    fontSize: 16,
                    fontWeight: 500,
                    color: '#333',
                    textBorderColor: '#ccc',
                    textBorderWidth: 1,
                    textShadowBlur: 2,
                    cursor: 'pointer' // 💡 鼠标变成点击手势
                }
            },
            tooltip: {
                trigger: 'item',
                formatter: '{b}：{c} 分钟 ({d}%)'
            },
            legend: {
                orient: 'vertical',
                left: 'left',
                top: 'middle',
                textStyle: {
                    fontSize: 14
                }
            },
            series: [{
                name: '活动时长',
                type: 'pie',
                radius: [20, 100],
                center: ['50%', '60%'],
                roseType: 'radius',
                label: {
                    show: true,
                    fontSize: 12
                },
                labelLine: {
                    smooth: 0.2,
                    length: 10,
                    length2: 10
                },
                itemStyle: {
                    shadowBlur: 10,
                    shadowColor: 'rgba(0, 0, 0, 0.1)'
                },
                data: pieData.map(item => ({
                    name: item.activityName,
                    value: (item.totalDurationToday/60).toFixed(2)
                }))
            }]
        };

        chart.setOption(option);

        // 标题点击复制事件
        chart.getZr().on('click', function (params) {
            const isClickOnTitle = params.offsetY <= 50; // 你可以根据实际位置调整范围
            if (isClickOnTitle) {
                // 计算总时间（分钟）
                const totalMinutes = pieData.reduce((sum, item) => sum + item.totalDurationToday / 60, 0);

                // 计算总小时数和剩余分钟数
                const totalHours = Math.floor(totalMinutes / 60);
                const totalRemainingMinutes = (totalMinutes % 60).toFixed(0);

                // 构建复制的文本，包含活动记录和总时间，使用 Markdown 格式
                const text = `### 今日活动记录\n\n**总时长:** ${totalHours}h ${totalRemainingMinutes}m\n\n` +
                    pieData.map(item => {
                        const hours = Math.floor(item.totalDurationToday / 3600);
                        const minutes = Math.floor((item.totalDurationToday % 3600) / 60);
                        return `- **${item.activityName}**: ${hours}h ${minutes}m`;
                    }).join('\n');

                // 显示在页面上
                const displayDiv = document.getElementById('activity-record-display-div');
                const display = document.getElementById('activity-record-display'); // 获取目标 div 元素
                if (displayDiv) {
                    // 更新显示的文本内容
                    display.textContent = text;

                    // 如果文本不为空，显示该 div，否则隐藏它
                    if (text.trim()) {
                        displayDiv.style.display = 'block'; // 显示
                    } else {
                        displayDiv.style.display = 'none'; // 隐藏
                    }
                }
                display.select(); // 选中内容
                display.setSelectionRange(0, 99999); // 兼容移动端
                const success = document.execCommand("copy");

                if (success) {
                    alert("复制成功！");
                } else {
                    alert("复制失败，请手动选中复制");
                }


                // navigator.clipboard.writeText(text).then(() => {
                //     alert('✅ 已复制活动数据到剪贴板！');
                // }).catch(err => {
                //     alert('❌ 复制失败：' + err);
                // });
            }
        });
    }

    // 响应式处理
    window.addEventListener('resize', () => {
        chart.resize();
    });
