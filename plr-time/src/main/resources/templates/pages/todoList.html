<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}" lang="zh">

<head>
  <title>任务列表</title>
</head>

<body>
<div layout:fragment="content" class="container mt-4">
  <!-- <h2>任务列表</h2> -->
  <button id="btnAddRoot" class="btn btn-primary mb-3">新增根任务</button>
  <ul id="todoListRoot" class="list-group"></ul>

  <!-- 任务模态框 -->
  <div class="modal fade" id="todoModal" tabindex="-1" aria-labelledby="todoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form id="todoForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="todoModalLabel">任务编辑</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>

        <div class="modal-body">
          <input type="hidden" id="todoId" name="todoId">
          <input type="hidden" id="parentId" name="parentId" value="0">

          <div class="mb-3">
            <label for="todoName" class="form-label">任务名称</label>
            <input type="text" class="form-control" id="todoName" name="todoName" required>
          </div>

          <div class="mb-3">
            <label for="todoType" class="form-label">任务类型</label>
            <input type="text" class="form-control" id="todoType" name="todoType">
          </div>

          <div class="mb-3">
            <label for="todoStatus" class="form-label">任务状态</label>
            <input type="text" class="form-control" id="todoStatus" name="todoStatus">
          </div>

          <div class="mb-3">
            <label for="todoSchedule" class="form-label">任务进度</label>
            <input type="text" class="form-control" id="todoSchedule" name="todoSchedule">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div layout:fragment="scripts">
  <script>
    $(function () {
      // 任务加载
      function loadTodos(parentId, $container) {
        $.get('/todo/list', { parentId }, function (res) {
          if (res.code === '200') {

            const sorted = [...res.data].sort((a, b) => {
              // 先按状态排序：未完成在前，已完成在后
              if (a.todoStatus === '已完成' && b.todoStatus !== '已完成') return 1;
              if (a.todoStatus !== '已完成' && b.todoStatus === '已完成') return -1;

              // 同状态内按更新时间倒序
              const timeA = new Date(a.updatedTime).getTime();
              const timeB = new Date(b.updatedTime).getTime();
              return timeB - timeA;
            });

            $container.empty();
            sorted.forEach(todo => $container.append(createTodoItem(todo)));
          } else {
            alert('加载任务失败');
          }
        });
      }

      // 创建任务项
      function createTodoItem(todo) {
        const $li = $(`
          <li class="list-group-item d-flex justify-content-between align-items-start flex-column flex-md-row" data-id="${todo.todoId}">
            <div class="d-flex align-items-start">
              <div>
                <div>
                  <strong class="todo-name ${todo.todoStatus === '已完成' ? 'text-decoration-line-through text-muted' : ''}">
                    ${todo.todoName}
                  </strong>
                </div>
                <div class="text-muted small">
                  类型: ${todo.todoType || '无'} &nbsp;|&nbsp;
                  状态: ${todo.todoStatus || '未设置'} &nbsp;|&nbsp;
                  进度: ${todo.todoSchedule || '无'} &nbsp;|&nbsp;
                  <!-- 创建: ${formatTime(todo.createdTime)} &nbsp;|&nbsp; -->
                  更新: ${formatTime(todo.updatedTime)}
                </div>
              </div>
            </div>
            <div class="mt-2 mt-md-0 d-flex align-items-center flex-wrap gap-1">
              <input type="checkbox" class="form-check-input btn-toggle-complete" style="transform: scale(1.4); margin: 2px;"
                     ${todo.todoStatus === '已完成' ? 'checked' : ''}>
              <button class="btn btn-sm btn-success btn-add-subtask" title="新增子任务">+</button>
              <button class="btn btn-sm btn-warning btn-edit" title="编辑">✎</button>
              <button class="btn btn-sm btn-danger btn-delete" title="删除">×</button>
            </div>
          </li>
        `);

        const $subtaskUl = $('<ul class="list-group ms-4 mt-2 ps-3 border-start border-2 border-secondary-subtle" style="display:none;"></ul>');

        // 展开/收起
        $li.find('.d-flex.align-items-start').click(e => {
          if ($(e.target).is('button') || $(e.target).closest('button').length) return;
          $subtaskUl.is(':visible') ? $subtaskUl.slideUp() : ($subtaskUl.children().length || loadTodos(todo.todoId, $subtaskUl), $subtaskUl.slideDown());
        });

        $li.find('.btn-add-subtask').click(() => openTodoModal({ parentId: todo.todoId }));

        $li.find('.btn-edit').click(() => {
          $.get(`/todo/${todo.todoId}`, res => {
            res.code === '200' ? openTodoModal(res.data) : alert('获取任务详情失败');
          });
        });

        $li.find('.btn-delete').click(() => {
          if (confirm('确认删除此任务？')) {
            $.ajax({
              url: `/todo/delete/${todo.todoId}`,
              type: 'DELETE',
              success: res => res.code === '200' ? loadTodos(0, $('#todoListRoot')) : alert('删除失败')
            });
          }
        });

        $li.find('.btn-toggle-complete').change(function () {
          const checked = $(this).is(':checked');
          const newStatus = checked ? '已完成' : '未完成';
          const updatedTodo = { ...todo, todoStatus: newStatus };

          $.ajax({
            url: '/todo/update',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(updatedTodo),
            success: res => {
              if (res.code === '200') {
                $li.find('.todo-name').toggleClass('text-decoration-line-through text-muted', checked);
                $li.find('.text-muted.small').html(
                        `类型: ${todo.todoType || '无'} &nbsp;|&nbsp; 状态: ${newStatus} &nbsp;|&nbsp; 进度: ${todo.todoSchedule || '无'}`
                );
                todo.todoStatus = newStatus;
              } else alert('更新状态失败');
            }
          });
        });

        return $li.add($subtaskUl);
      }

      function formatTime(str) {
        return str ? str.substring(0, 16).replace('T', ' ') : '无';
      }

      function openTodoModal(todo = {}) {
        $('#todoId').val(todo.todoId || '');
        $('#parentId').val(todo.parentId || 0);
        $('#todoName').val(todo.todoName || '');
        $('#todoType').val(todo.todoType || '');
        $('#todoStatus').val(todo.todoStatus || '');
        $('#todoSchedule').val(todo.todoSchedule || '');
        $('#todoModalLabel').text(todo.todoId ? '编辑任务' : '新增任务');
        $('#todoModal').modal('show');

        // 等模态框完全显示后再聚焦
        $('#todoModal').on('shown.bs.modal', function () {
          $('#todoName').trigger('focus');
          // 只执行一次后移除绑定
          $('#todoModal').off('shown.bs.modal');
        });
      }

      $('#btnAddRoot').click(() => openTodoModal({ parentId: 0 }));

      $('#todoForm').submit(function (e) {
        e.preventDefault();
        const payload = {
          todoId: $('#todoId').val() ? parseInt($('#todoId').val()) : null,
          parentId: parseInt($('#parentId').val()),
          todoName: $('#todoName').val(),
          todoType: $('#todoType').val(),
          todoStatus: $('#todoStatus').val(),
          todoSchedule: $('#todoSchedule').val()
        };

        const url = payload.todoId ? '/todo/update' : '/todo/save';
        $.ajax({
          url,
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify(payload),
          success: res => {
            if (res.code === '200') {
              $('#todoModal').modal('hide');
              loadTodos(0, $('#todoListRoot'));
            } else alert('保存失败');
          }
        });
      });

      loadTodos(0, $('#todoListRoot'));
    });
  </script>
</div>
</body>
</html>
