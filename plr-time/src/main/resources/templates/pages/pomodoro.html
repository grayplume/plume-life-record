<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}" lang="zh">
<head>
  <title>时间进度</title>
  <style>
    .progress {
      height: 24px;
    }
    .progress-bar {
      transition: width 0.5s ease-in-out;
    }
    .progress-label {
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
<div layout:fragment="content">
  <div class="container mt-5">
    <h2 class="text-center mb-5">时间进度展示</h2>

    <div class="mb-4">
      <h5>今年进度 <span id="yearProgressText" class="float-end progress-label"></span></h5>
      <div class="progress">
        <div id="yearProgress" class="progress-bar bg-primary progress-bar-striped progress-bar-animated" role="progressbar"></div>
      </div>
    </div>

    <div class="mb-4">
      <h5>本月进度 <span id="monthProgressText" class="float-end progress-label"></span></h5>
      <div class="progress">
        <div id="monthProgress" class="progress-bar bg-success progress-bar-striped progress-bar-animated" role="progressbar"></div>
      </div>
    </div>

    <div class="mb-4">
      <h5>本周进度 <span id="weekProgressText" class="float-end progress-label"></span></h5>
      <div class="progress">
        <div id="weekProgress" class="progress-bar bg-warning progress-bar-striped progress-bar-animated" role="progressbar"></div>
      </div>
    </div>

    <div class="mb-4">
      <h5>今日进度 <span id="dayProgressText" class="float-end progress-label"></span></h5>
      <div class="progress">
        <div id="dayProgress" class="progress-bar bg-danger progress-bar-striped progress-bar-animated" role="progressbar"></div>
      </div>
    </div>
  </div>
</div>

<div layout:fragment="scripts">
  <script>
    function getProgress(current, total) {
      return Math.min(100, (current / total * 100).toFixed(4));
    }

    function updateProgressBars() {
      const now = new Date();
      const week = getISOWeekNumber(now);

      // ==== 今年 ====
      const startOfYear = new Date(now.getFullYear(), 0, 1);
      const endOfYear = new Date(now.getFullYear() + 1, 0, 1);
      const totalYear = endOfYear - startOfYear;
      const passedYear = now - startOfYear;
      const yearProgress = getProgress(passedYear, totalYear);
      const yearDays = Math.floor(passedYear / 86400000);
      const yearTotalDays = Math.round(totalYear / 86400000);
      setProgress("year", yearProgress, `${yearDays} / ${yearTotalDays} 天`);

      // ==== 月 ====
      const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
      const totalMonth = endOfMonth - startOfMonth;
      const passedMonth = now - startOfMonth;
      const monthProgress = getProgress(passedMonth, totalMonth);
      const monthDays = Math.floor(passedMonth / 86400000);
      const monthTotalDays = Math.round(totalMonth / 86400000);
      setProgress("month", monthProgress, `${monthDays} / ${monthTotalDays} 天`);

      // ==== 周 ====
      const weekday = now.getDay() || 7;
      const startOfWeek = new Date(now);
      startOfWeek.setHours(0, 0, 0, 0);
      startOfWeek.setDate(now.getDate() - weekday + 1);
      const endOfWeek = new Date(startOfWeek);
      endOfWeek.setDate(startOfWeek.getDate() + 7);
      const weekTotal = endOfWeek - startOfWeek;
      const weekPassed = now - startOfWeek;
      const weekProgress = getProgress(weekPassed, weekTotal);
      const weekHours = Math.floor(weekPassed / 3600000);
      setProgress("week", weekProgress, `${weekHours} / 168 小时`);

      // ==== 日 ====
      const startOfDay = new Date(now);
      startOfDay.setHours(0, 0, 0, 0);
      const endOfDay = new Date(now);
      endOfDay.setHours(24, 0, 0, 0);
      const dayTotal = endOfDay - startOfDay;
      const dayPassed = now - startOfDay;
      const dayProgress = getProgress(dayPassed, dayTotal);
      const h = now.getHours();
      const m = now.getMinutes().toString().padStart(2, '0');
      const s = now.getSeconds().toString().padStart(2, '0');
      setProgress("day", dayProgress, `W${week} ${h}:${m}:${s}`);
    }

    function getISOWeekNumber(date) {
      const tmp = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = tmp.getUTCDay() || 7; // 周日变成 7
      tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil(((tmp - yearStart) / 86400000 + 1) / 7);
      return weekNo;
    }


    function setProgress(id, percent, labelText) {
      const bar = document.getElementById(id + "Progress");
      const label = document.getElementById(id + "ProgressText");

      bar.style.width = percent + "%";
      bar.setAttribute("aria-valuenow", percent);
      label.textContent = `${labelText}（${parseFloat(percent).toFixed(2)}%）`;
    }

    updateProgressBars();
    setInterval(updateProgressBars, 1000); // 每秒更新
  </script>
</div>
</body>
</html>
