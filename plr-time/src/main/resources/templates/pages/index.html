<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}" lang="zh">
<head>
    <title>Activities Management</title>
    <style>
        body {
            background-color: #f1f3f5;
        }

        h2 {
            text-align: center;
            margin: 40px 0 30px;
            font-weight: 600;
            color: #333;
        }

        .activity-card {
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-width: 2px;
            border-radius: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            padding: 5px;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.05);
        }

        .activity-card:hover {
            transform: scale(1.015);
            box-shadow: 0 0 16px rgba(0, 0, 0, 0.1);
        }

        .status-ongoing {
            border-color: #28a745 !important;
            box-shadow: 0 0 12px rgba(40, 167, 69, 0.3);
        }

        .status-ended {
            border-color: #6c757d !important;
            background-color: #f8f9fa;
        }

        .status-unknown {
            border-color: #343a40 !important;
            background-color: #e9ecef;
            filter: grayscale(40%);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .status-bar {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .status-indicator {
            width: 8px;
            height: 20px;
            border-radius: 4px;
            margin-right: 8px;
        }

        .status-ongoing-bar .status-indicator {
            background-color: #28a745;
        }

        .status-ended-bar .status-indicator {
            background-color: #6c757d;
        }

        .status-unknown-bar .status-indicator {
            background-color: #343a40;
        }

        .btn {
            padding: 6px 14px;
            font-size: 0.9rem;
        }

        .active-timer-container {
            display: inline-block;
            padding: 2px 6px;
            background-color: #e6f4ea;
            color: #198754;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 2px;
            line-height: 1.2;
        }

        #activitiesContainer {
            min-height: 300px;
            position: relative;
        }

        #loadingPlaceholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        #loadingPlaceholder .spinner-border {
            width: 3rem;
            height: 3rem;
        }

        #loadingPlaceholder .loading-text {
            margin-top: 12px;
            color: #6c757d;
            font-size: 1rem;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="container">
        <!-- <h2>活动时间管理</h2> -->
        <div class="row" id="activitiesContainer">
            <!-- 加载中占位符 -->
            <div id="loadingPlaceholder">
                <div class="spinner-border text-secondary" role="status"></div>
                <div class="loading-text">正在加载活动列表...</div>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
    <script>
        function loadActivityList() {
            $.get('/statistics/show', function (res) {
                if (res.code === '200') {
                    const list = res.data;
                    const container = $('#activitiesContainer');
                    container.empty(); // 清空 loading 占位符

                    list.forEach(activity => {
                        const status = activity.status;
                        let statusClass = '', statusText = '', btnClass = '', btnText = '';

                        if (status === 1) {
                            statusClass = 'status-ongoing';
                            statusText = '进行中';
                            btnClass = 'btn-outline-success';
                            btnText = '结束';
                        } else if (status === 0) {
                            statusClass = 'status-ended';
                            statusText = '已结束';
                            btnClass = 'btn-outline-secondary';
                            btnText = '开始';
                        } else {
                            statusClass = 'status-unknown';
                            statusText = '未知';
                            btnClass = 'btn-outline-dark';
                            btnText = '开始';
                        }

                        let timerHtml = '';
                        if (status === 1) {
                            const updatedAt = new Date(activity.updatedAt).getTime();
                            timerHtml = `
                                <div class="active-timer-container active-timer"
                                     id="timer-${activity.activityId}"
                                     data-start="${updatedAt}">
                                    <span id="timer-${activity.activityId}-text" class="timer-text">加载中...</span>
                                </div>`;
                        }

                        const html = `
                            <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                                <div class="card activity-card border ${statusClass}">
                                    <div class="card-body d-flex flex-column">
                                        <div class="status-bar ${statusClass}-bar">
                                            <div class="status-indicator"></div>
                                            <span>${statusText}</span>
                                            <p>${timerHtml}</p>
                                        </div>
                                        <h5 class="card-title">${activity.activityName}</h5>
                                        <p class="card-text mb-1">时长：${Math.floor(activity.totalDuration / 60)}h ${activity.totalDuration % 60}m</p>
                                        <button class="btn ${btnClass} mt-auto"
                                                onclick="toggleTimer(event, ${activity.activityId}, ${activity.status})">
                                            ${btnText}
                                        </button>
                                    </div>
                                </div>
                            </div>`;
                        container.append(html);
                        startActiveTimers();
                    });
                }
            });
        }

        function startActiveTimers() {
            $('.active-timer').each(function () {
                const el = $(this);
                const startMs = parseInt(el.data('start'), 10);
                const textEl = $(`#${el.attr('id')}-text`);

                function update() {
                    const now = Date.now();
                    const elapsed = Math.floor((now - startMs) / 1000);
                    const h = Math.floor(elapsed / 3600);
                    const m = Math.floor((elapsed % 3600) / 60);
                    const s = elapsed % 60;
                    textEl.text(`${h}h ${m}m ${s}s`);
                }

                update();
                setInterval(update, 1000);
            });
        }

        function toggleTimer(event, activityId, status) {
            const button = event.target;
            button.disabled = true;
            button.textContent = '处理中...';

            const url = status === 1 ? '/timeRecord/end' : '/timeRecord/start';

            $.ajax({
                url: url,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ activityId }),
                success: function () {
                    showToasts(status === 1 ? '计时已结束' : '计时已开始', 'success');
                    loadActivityList();
                },
                error: function () {
                    showToasts('操作失败，请重试', 'error');
                    button.disabled = false;
                    button.textContent = status === 1 ? '结束' : '开始';
                }
            });
        }

        function showToasts(msg, type) {
            showToast(msg, type);
        }

        $(function () {
            loadActivityList();
        });
    </script>
</div>
</body>
</html>
