<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}" lang="zh">
<head>
    <title>Activities Management</title>
    <style>
         body {
             background-color: #f1f3f5;
         }

        h2 {
            text-align: center;
            margin: 40px 0 30px;
            font-weight: 600;
            color: #333;
        }

        .activity-card {
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-width: 2px;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            padding: 12px;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.05);
        }

        .activity-card:hover {
            transform: scale(1.015);
            box-shadow: 0 0 16px rgba(0, 0, 0, 0.1);
        }

        .status-ongoing {
            border-color: #28a745 !important;
            box-shadow: 0 0 12px rgba(40, 167, 69, 0.3);
        }

        .status-ended {
            border-color: #6c757d !important;
            background-color: #f8f9fa;
        }

        .status-unknown {
            border-color: #343a40 !important;
            background-color: #e9ecef;
            filter: grayscale(40%);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .status-bar {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .status-indicator {
            width: 8px;
            height: 20px;
            border-radius: 4px;
            margin-right: 8px;
        }

        .status-ongoing-bar .status-indicator {
            background-color: #28a745;
        }

        .status-ended-bar .status-indicator {
            background-color: #6c757d;
        }

        .status-unknown-bar .status-indicator {
            background-color: #343a40;
        }

        .btn {
            padding: 6px 14px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="container">
        <!-- <h2>活动时间管理</h2> -->
        <div class="row" id="activitiesContainer">
            <!-- 卡片内容将被动态插入 -->
        </div>
    </div>
</div>

<div layout:fragment="scripts">
    <script>
        function loadActivityList() {
            $.get('/statistics/show', function (res) {
                if (res.code === '200') {
                    const list = res.data;
                    const container = $('#activitiesContainer');
                    container.empty();

                    list.forEach(activity => {
                        const status = activity.status;

                        // 状态样式类 + 文本
                        let statusClass = '';
                        let statusText = '';
                        let btnClass = '';
                        let btnText = '';

                        if (status === 1) {
                            statusClass = 'status-ongoing';
                            statusText = '进行中';
                            btnClass = 'btn-outline-success'; // 更柔和的绿色
                            btnText = '结束';
                        } else if (status === 0) {
                            statusClass = 'status-ended';
                            statusText = '已结束';
                            btnClass = 'btn-outline-secondary'; // 中性色
                            btnText = '开始';
                        } else {
                            statusClass = 'stat us-unknown';
                            statusText = '未知';
                            btnClass = 'btn-outline-dark'; // 灰黑色
                            btnText = '开始';
                        }


                        const html = `
                            <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                                <div class="card activity-card border ${statusClass}">
                                    <div class="card-body d-flex flex-column">
                                        <div class="status-bar ${statusClass}-bar">
                                            <div class="status-indicator"></div>
                                            <span>${statusText}</span>
                                        </div>
                                        <h5 class="card-title">${activity.activityName}</h5>
                                        <p class="card-text mb-1">时长：${Math.floor(activity.totalDuration / 60)}h ${activity.totalDuration % 60}m</p>
                                        <button class="btn ${btnClass} mt-auto "
                                                onclick="toggleTimer(event, ${activity.activityId}, ${activity.status})">
                                            ${btnText}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.append(html);
                    });
                }
            });
        }

        function toggleTimer(event, activityId, status) {
            const button = event.target;
            button.disabled = true;
            button.textContent = '处理中...';

            const url = status === 1 ? '/timeRecord/end' : '/timeRecord/start';

            $.ajax({
                url: url,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ activityId }),
                success: function () {
                    showToasts(status === 1 ? '计时已结束' : '计时已开始', 'success');
                    loadActivityList();
                },
                error: function () {
                    showToasts('操作失败，请重试', 'error');
                    button.disabled = false;
                    button.textContent = status === 1 ? '结束' : '开始';
                }
            });
        }

        function showToasts(msg, type) {
            // alert(msg); // 你可以替换成更美观的提示组件
            showToast(msg, type)
        }
        $(function () {
            loadActivityList();
        });
    </script>
</div>
</body>
</html>
