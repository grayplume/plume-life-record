<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}" lang="zh">
<head>
    <title>分类管理</title>
    <style>
        /* 按钮样式 */
        .btn {
            display: inline-block;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
            text-align: center;
            text-decoration: none;
            white-space: nowrap;
            vertical-align: middle;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .btn-secondary {
            background-color: #f5f5f5;
            color: #333;
            border-color: #ddd;
        }

        .btn-secondary:hover {
            background-color: #e8e8e8;
            border-color: #ccc;
        }

        .btn-primary {
            background-color: #333;
            color: white;
        }

        .btn-primary:hover {
            background-color: #222;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        /* 操作按钮 */
        .btn-edit {
            background-color: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-delete {
            background-color: #f5f5f5;
            color: #e74a3b;
            border: 1px solid #ddd;
        }

        .btn-edit:hover {
            background-color: #e8e8e8;
            border-color: #ccc;
        }

        .btn-delete:hover {
            background-color: #f8e8e7;
            border-color: #e74a3b;
        }

    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <!-- <h2>分类管理</h2> -->

        <!-- 新增按钮 -->
        <div class="mb-2 text-end">
            <button class="btn btn-secondary" onclick="openCategoryModal()">新增分类</button>
        </div>

        <div class="card">
            <div class="table-responsive">
                <!-- 任务加载中占位符 -->
                <div id="tasksLoadingPlaceholder" style="position: absolute; top:50%; left:50%; transform: translate(-50%, -50%); text-align: center;">
                    <div class="spinner-border text-secondary" style="width: 3rem; height: 3rem;" role="status"></div>
                    <div class="loading-text" style="margin-top:12px; color:#6c757d; font-size:1rem;">正在加载任务列表...</div>
                </div>
                <table class="table" id="categoryTable">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cname</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- 分类数据渲染由 JS 动态加载 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 模态框：新增/编辑分类 -->
        <div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form id="categoryForm">
                        <div class="modal-header">
                            <h5 class="modal-title" id="categoryModalLabel">新增分类</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="categoryId">
                            <div class="mb-3">
                                <label for="categoryNameInput" class="form-label">分类名称</label>
                                <input type="text" class="form-control" id="categoryNameInput" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                            <button type="submit" class="btn btn-primary">保存</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>>

<div layout:fragment="scripts">
    <script>
        const categoryModal = new bootstrap.Modal(document.getElementById('categoryModal'));

        function openCategoryModal() {
            document.getElementById('categoryForm').reset();
            document.getElementById('categoryId').value = '';
            document.getElementById('categoryModalLabel').textContent = '新增分类';
            categoryModal.show();
        }

        function editCategory(btn) {
            const id = btn.getAttribute('data-id');
            const name = btn.getAttribute('data-name');
            document.getElementById('categoryId').value = id;
            document.getElementById('categoryNameInput').value = name;
            document.getElementById('categoryModalLabel').textContent = '编辑分类';
            categoryModal.show();
        }

        function deleteCategory(btn) {
            const id = btn.getAttribute('data-id');
            if (confirm('确定删除该分类？')) {
                $.post('/category/delete/' + id, function (res) {
                    if (res.code === 200) {
                        showToast('删除成功', "warning");
                        loadCategoryList();
                    } else {
                        showToast('删除失败', "error");
                    }
                });
            }
        }

        function loadCategoryList() {
            const loadingPlaceholder = $('#tasksLoadingPlaceholder');
            loadingPlaceholder.show();    // 显示加载中

            console.log("loadCategoryList")
            $.get('/category/list', function (res) {
                // console.log(res);
                if (res.code === '200') {
                    const list = res.data;
                    const tbody = $('#categoryTable tbody');
                    tbody.empty();
                    list.forEach(category => {
                        tbody.append(`
                        <tr>
                            <td>${category.categoryId}</td>
                            <td>${category.categoryName}</td>
                            <td>
                                <button class="btn btn-sm btn-edit me-2"
                                        onclick="editCategory(this)"
                                        data-id="${category.categoryId}"
                                        data-name="${category.categoryName}">
                                    编辑
                                </button>
                                <button class="btn btn-sm btn-delete"
                                        onclick="deleteCategory(this)"
                                        data-id="${category.categoryId}">
                                    删除
                                </button>
                            </td>
                        </tr>
                    `);
                    });
                    loadingPlaceholder.hide();
                }
            });
        }

        $('#categoryForm').on('submit', function (e) {
            e.preventDefault();
            const id = $('#categoryId').val();
            const categoryName = $('#categoryNameInput').val().trim();

            const payload = { categoryName };
            let url = '/category/save';

            if (id) {
                payload.categoryId = parseInt(id);
                url = '/category/update';
            }

            $.ajax({
                url: url,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function (res) {
                    if (res.code === '200') {
                        categoryModal.hide();
                        showToast(id ? '更新成功' : '添加成功', "success");
                        loadCategoryList();
                    } else {
                        showToast('操作失败', "error");
                    }
                }
            });
        });

        $(function () {
            loadCategoryList();
        });
    </script>

</div>

</body>
</html>
