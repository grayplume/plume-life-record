<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}" lang="zh">
<head>
  <title>活动时间分布</title>
</head>
<body>
<div layout:fragment="content">

  <div>
    <label>
      日期:
      <input type="date" id="dateInput">
    </label>

    <label>
      月份:
      <input type="month" id="monthInput">
    </label>

    <label>
      分类:
      <select id="categorySelect">
        <option value="">全部分类</option>
      </select>
    </label>

    <button id="copyRankingBtn" class="btn btn-outline-secondary btn-sm">
      复制数据
    </button>



  </div>

  <!-- 每日活动排行榜 -->
  <div id="rankingChart" style="width: 100%; height: 400px; margin-top: 30px;"></div>

  <!-- 饼图容器，设置为 flex 横向排列 -->
  <div style="display: flex; justify-content: space-between; flex-wrap: wrap; margin-top: 30px;">
    <!-- 每日活动饼图 -->
    <div id="rankingPieChart" style="flex: 1; min-width: 300px; height: 400px;"></div>
    <!-- 每月活动饼图 -->
    <div id="rankingMonthPieChart" style="flex: 1; min-width: 300px; height: 400px;"></div>
  </div>

  <!-- 每日时间分布 -->
  <div id="dayChart" style="width: 100%; height: 350px; margin-top: 20px;"></div>
  <!-- 每月活动排行榜 -->
  <div id="rankingMonthChart" style="width: 100%; height: 400px; margin-top: 30px;"></div>
  <!-- 每月时间分布 -->
  <div id="monthChart" style="width: 100%; height: 350px; margin-top: 50px;"></div>

</div>

<div layout:fragment="scripts">
  <script th:src="@{/echarts.min.js}"></script>
  <script>
    const rankingChart = echarts.init(document.getElementById('rankingChart'));
    const chart2 = echarts.init(document.getElementById('rankingPieChart'));
    const rankingMonthPieChart  = echarts.init(document.getElementById('rankingMonthPieChart'));
    const dayChart = echarts.init(document.getElementById('dayChart'));
    const rankingMonthChart = echarts.init(document.getElementById('rankingMonthChart'));
    const monthChart = echarts.init(document.getElementById('monthChart'));

    window.addEventListener('resize', () => {
      rankingChart.resize();
      chart2.resize();
      rankingMonthPieChart.resize();
      dayChart.resize();
      rankingMonthChart.resize();
      monthChart.resize();
    });

    // 默认日期和月份
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');

    $('#dateInput').val(`${yyyy}-${mm}-${dd}`);
    $('#monthInput').val(`${yyyy}-${mm}`);

    function loadCategories() {
      $.get('/category/list').done(res => {
        if (res.code === '200' || res.code === 0) {
          const categories = res.data;
          const select = $('#categorySelect');
          select.empty().append(`<option value="">全部分类</option>`);
          categories.forEach(cat => {
            select.append(`<option value="${cat.categoryId}">${cat.categoryName}</option>`);
          });
        } else {
          alert('加载分类失败: ' + (res.message || '未知错误'));
        }
      }).fail((_, __, error) => alert('分类请求错误: ' + error));
    }

    // 存储当日排行榜
    let cachedDailyRankingData = [];

    function loadActivityRanking() {
      const date = $('#dateInput').val();
      const categoryId = $('#categorySelect').val();

      if (!date) {
        alert('请选择日期');
        return;
      }

      $.get('/statistics/activityRanking', { date, categoryId: categoryId || null })
              .done(res => {
                if (res.code === '200' || res.code === 0) {
                  const data = res.data || [];
                  console.log(data);
                  cachedDailyRankingData = data;

                  const names = data.map(d => d.activityName);
                  const minutes = data.map(d => (d.totalDurationToday / 60).toFixed(0));
                  const totalMinutes = minutes.reduce((a, b) => parseFloat(a) + parseFloat(b), 0);
                  const hours_display = Math.floor(totalMinutes / 60);
                  const minutes_display = totalMinutes % 60;

                  // 设置图表
                  rankingChart.setOption({
                    title: { text: `当日时长排行榜（${date}） 总时长: ${hours_display}时${minutes_display}分钟` },
                    tooltip: {
                      trigger: 'axis',
                      formatter: params => {
                        return params.map(p => `${p.marker} ${p.name}: ${p.data} 分钟`).join('<br/>');
                      }
                    },
                    grid: {
                      left: '10px',
                      right: '80px',
                      bottom: '30px',
                      containLabel: true
                    },
                    yAxis: { type: 'category', data: names,inverse : true,},
                    xAxis: { type: 'value', name: '分钟' },
                    dataZoom: [{
                      type: 'slider',
                      yAxisIndex: 0,
                      start: 0,
                      end: 100, // 默认显示前80%的活动
                      orient: 'vertical' // 垂直滚动条
                    }],
                    series: [{
                      name: '总时长',
                      type: 'bar',
                      data: minutes,
                      label: {
                        show: true,
                        position: 'right',
                        formatter: '{c} min'
                      },
                      itemStyle: { color: '#5470C6' }
                    }]
                  });

                  // 饼图 ============================================
                  // 计算原始数据（用于饼图）
                  const pieData = data.map(d => ({
                    name: d.activityName,
                    value: (d.totalDurationToday / 60).toFixed(1)  // 转换为分钟并保留一位小数
                  }));

                  const option2 = {
                    title: {
                      text: '当日活动占比',
                      left: 'center'
                    },
                    tooltip: {
                      trigger: 'item',
                      formatter: '{b}: {c} 分钟 ({d}%)',
                    },
                    legend: {
                      orient: 'horizontal',
                      left: 'center',
                      bottom: 10,
                      data: pieData.map(item => item.name),
                      overflow: 'scroll',    // 超长时滚动，避免换行
                    },
                    series: [{
                      name: '当日时长分布',
                      type: 'pie',
                      radius: ['30%', '50%'],
                      data: pieData,
                      emphasis: {
                        itemStyle: {
                          shadowBlur: 10,
                          shadowOffsetX: 0,
                          shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                      },
                      label: {
                        formatter: '{b}\n{c}分钟',
                        position: 'outside',
                      }
                    }]
                  };

                  chart2.setOption(option2);

                } else {
                  alert('加载失败: ' + (res.message || '未知错误'));
                  rankingChart.clear();
                }
              })
              .fail((_, __, error) => {
                alert('请求错误: ' + error);
                rankingChart.clear();
              });
    }

    // 加载“按日”24小时分布图（单位：小时）
    function loadDayChart(date, categoryId) {
      $.get('/statistics/dayTimeDistribution', { date, categoryId: categoryId || null })
              .done(res => {
                if (res.code === '200' || res.code === 0) {
                  const hours = res.data.map(d => `${d.hour}点`);
                  const values = res.data.map(d => (d.durationMinutes / 60).toFixed(1));

                  dayChart.setOption({
                    title: { text: `每日时间分布（${date}） 单位：小时` },
                    tooltip: {
                      formatter: params => `${params.name}<br/>${params.marker} 活动时长: ${params.data} 小时`
                    },
                    xAxis: { type: 'category', data: hours },
                    yAxis: { type: 'value', name: '时长（小时）' },
                    dataZoom: [{
                      type: 'slider',
                      xAxisIndex: 0,
                      start: 40,
                      end: 100, // 默认显示前80%的活动
                      orient: 'horizontal'
                    }],
                    series: [{
                      name: '活动时长',
                      type: 'bar',
                      data: values,
                      itemStyle: { color: '#5470C6' }
                    }]
                  });
                } else {
                  alert('获取按日数据失败: ' + (res.message || '未知错误'));
                  dayChart.clear();
                }
              }).fail((_, __, error) => {
        alert('请求错误: ' + error);
        dayChart.clear();
      });
    }

    function loadMonthActivityRanking() {
      const month = $('#monthInput').val();
      const categoryId = $('#categorySelect').val();

      if (!month) {
        alert('请选择月份');
        return;
      }

      $.get('/statistics/activityRankingByMonth', { month, categoryId: categoryId || null })
              .done(res => {
                if (res.code === '200' || res.code === 0) {
                  const data = res.data || [];
                  console.log(data);

                  const names = data.map(d => d.activityName);
                  const minutes = data.map(d => (d.totalDurationToday / 3600).toFixed(1));

                  // 设置图表
                  rankingMonthChart.setOption({
                    title: { text: `当月时长排行榜（${month}） 单位：小时` },
                    tooltip: {
                      trigger: 'axis',
                      formatter: params => {
                        return params.map(p => `${p.marker} ${p.name}: ${p.data} 小时`).join('<br/>');
                      }
                    },
                    grid: {
                      left: '10px',
                      right: '80px',
                      bottom: '30px',
                      containLabel: true
                    },
                    yAxis: { type: 'category', data: names,inverse : true,},
                    xAxis: { type: 'value', name: '小时' },
                    dataZoom: [{
                      type: 'slider',
                      yAxisIndex: 0,
                      start: 0,
                      end: 100, // 默认显示前80%的活动
                      orient: 'vertical' // 垂直滚动条
                    }],
                    series: [{
                      name: '总时长',
                      type: 'bar',
                      data: minutes,
                      label: {
                        show: true,
                        position: 'right',
                        formatter: '{c} h'
                      },
                      itemStyle: { color: '#5470C6' }
                    }]
                  });

                  // 饼图 ============================================
                  // 计算原始数据（用于饼图）
                  const pieData = data.map(d => ({
                    name: d.activityName,
                    value: (d.totalDurationToday / 3600).toFixed(1)  // 转换为分钟并保留一位小数
                  }));

                  const rankingMonthPieChartOption = {
                    title: {
                      text: '当月活动占比',
                      left: 'center'
                    },
                    tooltip: {
                      trigger: 'item',
                      formatter: '{b}: {c} 小时 ({d}%)',
                    },
                    legend: {
                      orient: 'horizontal',
                      left: 'center',
                      bottom: 10,
                      data: pieData.map(item => item.name),
                      overflow: 'scroll',    // 超长时滚动，避免换行
                    },
                    series: [{
                      name: '当日时长分布',
                      type: 'pie',
                      radius: ['30%', '50%'],
                      data: pieData,
                      emphasis: {
                        itemStyle: {
                          shadowBlur: 10,
                          shadowOffsetX: 0,
                          shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                      },
                      // label: {
                      //   formatter: '{b}\n{c}小时',
                      //   position: 'outside',
                      // }
                    }]
                  };

                  rankingMonthPieChart.setOption(rankingMonthPieChartOption);

                } else {
                  alert('加载失败: ' + (res.message || '未知错误'));
                  rankingMonthChart.clear();
                }
              })
              .fail((_, __, error) => {
                alert('请求错误: ' + error);
                rankingMonthChart.clear();
              });
    }

    // 加载“按月”每天分布图（单位：小时）
    function loadMonthChart(month, categoryId) {
      $.get('/statistics/monthTimeDistribution', { month, categoryId: categoryId || null })
              .done(res => {
                if (res.code === '200' || res.code === 0) {
                  if (!res.data || res.data.length === 0) {
                    alert('无按月数据');
                    monthChart.clear();
                    return;
                  }

                  const dates = res.data.map(d => {
                    const day = d.date.split('-')[2];
                    return `${day}日`;
                  });
                  const values = res.data.map(d => (d.durationMinutes / 60).toFixed(1));

                  monthChart.setOption({
                    title: { text: `月度时间分布 (${month}) 单位：小时` },
                    tooltip: {
                      trigger: 'axis',
                      formatter: params => {
                        let content = params[0].axisValue + '<br/>';
                        params.forEach(p => {
                          content += `${p.marker} ${p.seriesName}: ${p.data} 小时<br/>`;
                        });
                        return content;
                      }
                    },
                    xAxis: { type: 'category', data: dates },
                    yAxis: { type: 'value', name: '时长（小时）' },
                    dataZoom: [{
                      type: 'slider',
                      xAxisIndex: 0,
                      start: 0,
                      end: 100, // 默认显示前80%的活动
                      orient: 'horizontal'
                    }],
                    series: [{
                      name: '活动时长',
                      type: 'bar',
                      data: values,
                      itemStyle: { color: '#5470C6' }
                    }]
                  });
                } else {
                  alert('获取按月数据失败: ' + (res.message || '未知错误'));
                  monthChart.clear();
                }
              }).fail((_, __, error) => {
        alert('请求错误: ' + error);
        monthChart.clear();
      });
    }

    $('#copyRankingBtn').on('click', function () {
      if (!cachedDailyRankingData || cachedDailyRankingData.length === 0) {
        alert('没有排行榜数据可复制，请先加载排行榜。');
        return;
      }

      const date = $('#dateInput').val();
      const lines = [`📊 ${date} 当日活动排行榜：`, '', '| 活动名称 | 时长（h） |', '|:--|:--|'];

      cachedDailyRankingData.forEach((item) => {
        const durationMin = (item.totalDurationToday / 60 / 60).toFixed(1);
        lines.push(`| ${item.activityName} | ${durationMin} |`);
      });

      const text = lines.join('\n');


      // 复制到剪贴板
      navigator.clipboard.writeText(text)
              // .then(() => alert('已复制到剪贴板！'))
              .then(() => showToast('已复制到剪贴板！'))
              .catch(err => {
                console.error('复制失败:', err);
                // alert('复制失败，请检查浏览器权限');
                showToast('复制失败，请检查浏览器权限')
              });
    });


    function loadAllCharts() {
      const date = $('#dateInput').val();
      const month = $('#monthInput').val();
      const categoryId = $('#categorySelect').val();

      if (!date) {
        alert('请选择日期');
        return;
      }
      if (!month) {
        alert('请选择月份');
        return;
      }
      console.info( '加载数据:', date, month, categoryId)
      loadActivityRanking();
      loadDayChart(date, categoryId);
      loadMonthChart(month, categoryId);
      loadMonthActivityRanking(month,categoryId)
    }

    $(function () {
      // loadActivityRanking();
      loadCategories();
      loadAllCharts();

      $('#dateInput, #monthInput, #categorySelect').on('change', loadAllCharts);
    });
  </script>
</div>

</body>
</html>
