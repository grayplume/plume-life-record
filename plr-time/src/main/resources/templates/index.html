<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=0.8">
    <title>Activities Management</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            margin: 20px;
            width: 95%;   /* 确保宽度不超过屏幕 */
            overflow-x: hidden;  /* 防止横向滚动条 */
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px 15px;
            text-align: left;
        }

        th {
            background-color: #649765;
            color: white;
        }

        td {
            background-color: #fff;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .status {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 3px;
            color: white;
        }

        .status-1 { background-color: #4CAF50; } /* Green for status 1 */
        .status-2 { background-color: #868585; } /* Grey for status 2 */
        .status-3 { background-color: #f44336; } /* Red for status 3 */

        .action-button {
            background-color: #008CBA;
            color: white;
            border: none;
            padding: 8px 12px;
            text-align: center;
            cursor: pointer;
            border-radius: 5px;
            margin-right: 5px;
            transition: background-color 0.3s;
        }

        .action-button:hover {
            background-color: #005f7f;
        }

        a {
            text-decoration: none;
            color: #007BFF;
            font-weight: bold;
            margin-right: 20px;
        }

        a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

<h1>Time Management</h1>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>UID</th>
        <th>Name</th>
        <th>Time</th>
        <th>Status</th>
        <th>Exe</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="activity : ${activitiesList}">
        <td th:text="${activity.activityId}"></td>
        <td th:text="${activity.userId}"></td>
        <td th:text="${activity.name}"></td>

        <td th:with="totalMinutes=${statisticsVOS[activity.activityId]} ?: 0,
            hours=${totalMinutes / 60},
            minutes=${totalMinutes % 60}"
            th:text="${hours > 0 ? (minutes > 0 ? hours + ' h ' + minutes + ' m' : hours + ' h') : minutes + ' m'}">
        </td>

        <!-- 根据状态动态添加样式 -->
        <td>
            <span th:class="${activityIdStatusMap[activity.activityId] == 1 ? 'status status-1' :
                            activityIdStatusMap[activity.activityId] == 0 ? 'status status-2' : 'status status-3'}"
                  th:text="${activityIdStatusMap[activity.activityId]==1? 'RUNNING':'STOP'}">
            </span>
        </td>

        <td>
            <button class="action-button" th:attr="onclick='startTimer(' + ${activity.activityId} + ', ' + ${activity.userId} + ')'" >Start Timer</button>
            <button class="action-button" th:attr="onclick='endTimer(' + ${activity.activityId} + ', ' + ${activity.userId} + ')'" >End Timer</button>
        </td>
    </tr>
    </tbody>
</table>

<script>
    function startTimer(activityId, userId) {
        $.ajax({
            url: '/timeRecord/start',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({userId: userId, activityId: activityId}),
            success: function(response) {
                window.location.reload();
                alert('Timer started: ' + response.data);
            },
            error: function(error) {
                alert('Error starting timer: ' + error.responseText);
            }
        });
    }

    function endTimer(activityId, userId) {
        $.ajax({
            url: '/timeRecord/end',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({userId: userId, activityId: activityId}),
            success: function(response) {
                window.location.reload();
                alert('Timer ended: ' + response.data);
            },
            error: function(error) {
                alert('Error ending timer: ' + error.responseText);
            }
        });
    }
</script>

<a href="/web/test">Go to Test Page</a>

</body>
</html>
