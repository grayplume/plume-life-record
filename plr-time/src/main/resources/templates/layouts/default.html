<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="ch">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">PLR</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body>
<!-- 导航栏 -->
<!--<header th:replace="fragments/navbar :: navbar"></header>-->
<header th:replace="~{fragments/navbar :: navbar}"></header>

<!-- 主内容区域 -->
<main class="container my-4" layout:fragment="content">
    <!-- 默认内容，会被具体页面替换 -->
    <div class="alert alert-info">
        默认内容区域 - 应该被具体页面内容替换
    </div>
</main>

<!--提示-->
<div th:replace="~{fragments/toast :: toast}"></div>

<!-- 页脚 -->
<footer th:replace="~{fragments/footer :: footer}" class="mt-auto"></footer>

<!-- 公共脚本 -->
<div th:replace="~{fragments/scripts :: scripts}"></div>
<!-- 页面特定脚本 -->
<div layout:fragment="scripts"></div>
</body>
</html>
